name: Validate public release safeguards

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install validation dependency
        run: python -m pip install -r requirements.txt

      - name: Validate fictional candidate data
        run: python scripts/validate_candidate_data.py examples/candidate

      - name: Check example tailoring outputs
        run: >-
          python scripts/check_tailoring_output.py check
          examples/output/tailoring-report-example-company-example-city.json
          --candidate examples/candidate
          --template templates/resume.example.tex

      - name: Check publishable paths and content
        run: python scripts/check_public_tree.py

      - name: Run safeguard tests
        run: python -m unittest discover -s tests -v
