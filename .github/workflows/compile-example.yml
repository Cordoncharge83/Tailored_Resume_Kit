name: Compile example resume

on:
  push:
    paths:
      - scripts/compile_resume.py
      - tests/test_compile_resume.py
      - templates/resume.example.tex
      - examples/output/**
      - .github/workflows/compile-example.yml
  pull_request:
    paths:
      - scripts/compile_resume.py
      - tests/test_compile_resume.py
      - templates/resume.example.tex
      - examples/output/**
      - .github/workflows/compile-example.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache Tectonic and LaTeX packages
        uses: actions/cache@v6
        with:
          path: .tools
          key: tectonic-0.17.0-${{ runner.os }}

      - name: Compile fictional example resume
        run: >-
          python scripts/compile_resume.py
          examples/output/tailored-resume-example-company-example-city.tex
          --outdir "$RUNNER_TEMP/pdf"

      - name: Check the example fits on one page
        env:
          TAILORED_RESUME_KIT_COMPILE_TEST: "1"
        run: python -m unittest tests.test_compile_resume.ExampleCompileTests -v

      - name: Upload example PDF
        uses: actions/upload-artifact@v7
        with:
          name: example-resume-pdf
          path: ${{ runner.temp }}/pdf/*.pdf
          retention-days: 14
